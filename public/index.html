<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indus Valley Emoji Battle - Multiplayer Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic&display=swap" rel="stylesheet">
    <style>
        /* --- ORIGINAL STYLES PRESERVED --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; overflow: hidden; background: #1a1a2e; }
        
        /* Accessibility Modes */
        body.dyslexia-font, body.dyslexia-font * { font-family: 'OpenDyslexic', 'Arial', sans-serif !important; }
        body.high-contrast { background: #000; color: #fff; }
        body.high-contrast #startMenu { background: #000; border: 3px solid #fff; color: #fff; }

        #gameCanvas {
            display: block;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 50%, #1a1a2e 100%);
            cursor: crosshair;
        }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: white; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        /* Accessibility Controls */
        #a11y-controls {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; pointer-events: auto;
        }
        .a11y-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255,255,255,0.5);
            color: white; padding: 8px 12px; cursor: pointer; border-radius: 8px;
            font-size: 14px; transition: all 0.2s;
        }
        .a11y-btn:hover { background: rgba(255, 255, 255, 0.4); transform: scale(1.05); }

        /* Start Menu */
        #startMenu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px; width: 90%; pointer-events: auto; z-index: 100;
        }
        h1 { color: #e94560; margin-bottom: 20px; font-size: 2.5em; text-shadow: 2px 2px 0px #000; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"], select {
            width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd;
            border-radius: 8px; margin-bottom: 10px;
        }
        
        /* Emoji Selection */
        .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .emoji-option {
            font-size: 24px; cursor: pointer; padding: 10px; border-radius: 50%;
            border: 2px solid transparent; transition: transform 0.2s; background: #f0f0f0;
        }
        .emoji-option:hover { transform: scale(1.2); background: #fff; }
        .emoji-option.selected { border-color: #e94560; background: #ffd1d1; transform: scale(1.1); }

        #startButton {
            background: #e94560; color: white; border: none; padding: 15px 40px;
            font-size: 20px; border-radius: 50px; cursor: pointer;
            transition: transform 0.1s, background 0.2s; width: 100%; font-weight: bold;
        }
        #startButton:hover { background: #ff2e63; transform: scale(1.02); }
        #startButton:active { transform: scale(0.98); }

        /* Connection Status */
        #connection-status {
            margin-top: 10px; font-size: 12px; color: #666;
        }

        /* Quiz Modal */
        #quizModal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: white; padding: 30px;
            border-radius: 15px; width: 90%; max-width: 450px;
            box-shadow: 0 0 50px rgba(0,0,0,0.7); border: 4px solid #e94560;
            z-index: 200; text-align: center; pointer-events: auto;
        }
        .quiz-question { font-size: 20px; margin-bottom: 20px; color: #333; font-weight: bold; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-btn {
            background: #f0f0f0; border: 2px solid #ddd; padding: 15px;
            border-radius: 10px; cursor: pointer; font-size: 16px; transition: all 0.2s;
        }
        .quiz-btn:hover { background: #e0e0e0; border-color: #999; }
        .quiz-timer {
            height: 10px; background: #eee; margin-top: 20px; border-radius: 5px; overflow: hidden;
        }
        .quiz-timer-bar {
            height: 100%; background: #e94560; width: 100%; transition: width 1s linear;
        }

        /* Minimap */
        #minimap {
            position: absolute; bottom: 20px; right: 20px;
            border: 3px solid #e94560; border-radius: 10px;
            background: rgba(0,0,0,0.7); pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Leaderboard */
        #leaderboard {
            position: absolute; top: 20px; right: 20px;
            background: rgba(26, 26, 46, 0.9); color: white;
            padding: 15px; border-radius: 10px; min-width: 200px;
            border: 2px solid #e94560; max-height: 400px; overflow-y: auto;
            pointer-events: auto;
        }
        #leaderboard h3 {
            margin: 0 0 10px 0; color: #e94560; font-size: 18px;
        }
        .leaderboard-entry {
            padding: 8px; margin: 5px 0; background: rgba(15, 52, 96, 0.5);
            border-radius: 5px; display: flex; justify-content: space-between;
            font-size: 14px;
        }
        .leaderboard-entry.current-player {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            font-weight: bold;
        }

        /* Respawn Overlay */
        #respawnOverlay {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.9);
            padding: 40px 60px; border-radius: 20px; text-align: center;
            border: 3px solid #666; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 5000; color: white;
        }
        #respawnOverlay h2 {
            color: #888; margin-bottom: 20px; font-size: 2em;
        }
        #respawnOverlay .countdown {
            font-size: 4em; color: #e94560; font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        
        <div id="a11y-controls">
            <button class="a11y-btn" onclick="toggleDyslexia()">Dyslexia Font</button>
            <button class="a11y-btn" onclick="toggleContrast()">High Contrast</button>
            <button class="a11y-btn" onclick="toggleMotion()">Reduce Motion</button>
        </div>

        <div id="hud" style="display: none;">
            <div id="score-display">🏆 Knockouts: 0</div>
            <div id="room-display">📍 Room: Lobby</div>
            <div id="leaderboard-display" style="font-size: 14px; margin-top: 10px; opacity: 0.8;"></div>
        </div>

        <div id="startMenu">
            <h1>🛡️ Indus Battle</h1>
            
            <div class="input-group">
                <label for="playerName">Enter Your Name:</label>
                <input type="text" id="playerName" placeholder="Warrior Name" maxlength="15">
            </div>

            <label>Choose Your Avatar:</label>
            <div class="emoji-grid" id="emojiSelector">
                </div>

            <div class="input-group">
                <label for="roomSelect">Select Arena:</label>
                <select id="roomSelect">
                    <option value="arena-a">Arena A (Training)</option>
                    <option value="arena-b">Arena B (Harappa)</option>
                    <option value="arena-c">Arena C (Mohenjo-Daro)</option>
                    <option value="arena-d">Arena D (Citadel)</option>
                    <option value="arena-e">Arena E (The Great Bath)</option>
                </select>
                <div id="room-counts" style="font-size: 12px; color: #666; margin-top: 5px;">
                    Loading arena populations...
                </div>
            </div>

            <button id="startButton">ENTER ARENA</button>
            <div id="connection-status">Connecting to server...</div>
        </div>

        <div id="quizModal">
            <div class="quiz-question" id="quizQuestion">Question goes here?</div>
            <div class="quiz-options" id="quizOptions">
                </div>
            <div class="quiz-timer">
                <div class="quiz-timer-bar" id="timerBar"></div>
            </div>
        </div>
    </div>

    <!-- Minimap -->
    <canvas id="minimap" width="150" height="150"></canvas>

    <!-- Leaderboard -->
    <div id="leaderboard">
        <h3>🏆 Top Players</h3>
        <div id="leaderboardList"></div>
    </div>

    <!-- Respawn Overlay -->
    <div id="respawnOverlay" style="display:none;">
        <h2>☠️ SENT TO THE GRAVEYARD! ☠️</h2>
        <div class="countdown" id="respawnCountdown">15</div>
        <p>🪦 Waiting to respawn... 🪦</p>
        <p style="font-size: 14px; margin-top: 10px; color: #888;">You can still move around the graveyard!</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        // ===================================================================
        // 1. SETUP & CONFIGURATION
        // ===================================================================
        const socket = io(); // Auto-connects to Render or Localhost
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let gameStarted = false;
        let myId = null;
        let myPlayer = {
            x: 0, y: 0,
            emoji: '🛡️',
            name: 'Player',
            color: '#e94560',
            knockouts: 0,
            room: 'arena-a'
        };
        let otherPlayers = {}; // Stores all opponents
        
        // Inputs
        const keys = {};
        const mouse = { x: 0, y: 0 };
        
        // Constants
        const WORLD_WIDTH = 4000;
        const WORLD_HEIGHT = 4000;
        const SPEED = 5;
        const PLAYER_SIZE = 40;
        const COLLISION_DISTANCE = 60;
        const RESPAWN_TIME = 15000; // 15 seconds
        
        // Graveyard Safe Zone (center of map)
        const GRAVEYARD = {
            x: WORLD_WIDTH / 2,
            y: WORLD_HEIGHT / 2,
            width: 600,
            height: 500
        };
        
        // Camera
        const camera = { x: 0, y: 0 };
        
        // Respawn state
        let isRespawning = false;
        let respawnTimer = 0;
        
        // Accessibility State
        let settings = { dyslexia: false, contrast: false, motion: true };

        // Quiz Data (Indus Valley Civilization)
        const INDUS_QUESTIONS = [
            { q: "Which river was the Indus Valley Civilization built around?", a: ["Indus River", "Nile River", "Yellow River"], c: 0 },
            { q: "What were the two main cities?", a: ["Harappa & Mohenjo-Daro", "Athens & Sparta", "Rome & Carthage"], c: 0 },
            { q: "What was used to build their houses?", a: ["Baked Mud Bricks", "Stone", "Wood"], c: 0 },
            { q: "What famous structure was found in Mohenjo-Daro?", a: ["The Great Bath", "The Great Pyramid", "The Colosseum"], c: 0 },
            { q: "What writing system did they use?", a: ["Undeciphered Script", "Hieroglyphs", "Cuneiform"], c: 0 },
            { q: "What material were their seals made of?", a: ["Steatite (Stone)", "Gold", "Plastic"], c: 0 },
            { q: "Did they have a sewage system?", a: ["Yes, advanced drainage", "No", "Only for kings"], c: 0 },
            
            // Maurya Empire & Indian Geography
            { q: "Why is India called a subcontinent?", a: ["It's a large landmass separated by mountains", "It has many religions", "It's smaller than other continents"], c: 0 },
            { q: "Who founded the Maurya Empire?", a: ["Chandragupta Maurya", "Ashoka", "Kautilya"], c: 0 },
            { q: "What was Kautilya famous for writing?", a: ["Arthashastra (book on government)", "The Vedas", "Poetry"], c: 0 },
            { q: "How did Chandragupta defeat the Nanda Dynasty?", a: ["With Kautilya's help and strategy", "With magic powers", "Through marriage"], c: 0 },
            { q: "What was the capital of the Maurya Empire?", a: ["Pataliputra", "Delhi", "Mohenjo-Daro"], c: 0 },
            { q: "Which mountains separate India from the rest of Asia?", a: ["Himalayas", "Rocky Mountains", "Alps"], c: 0 },
            { q: "What did Kautilya advise rulers to have?", a: ["Spies and a strong army", "Only priests", "No government"], c: 0 }
        ];

        // Military Ranks
        const MILITARY_RANKS = [
            { min: 0, name: "Private", badge: "🔰" },
            { min: 1, name: "Corporal", badge: "⚔️" },
            { min: 3, name: "Sergeant", badge: "🛡️" },
            { min: 5, name: "Lieutenant", badge: "⭐" },
            { min: 8, name: "Captain", badge: "🌟" },
            { min: 12, name: "Major", badge: "💫" },
            { min: 15, name: "Colonel", badge: "🎖️" },
            { min: 20, name: "General", badge: "👑" },
            { min: 30, name: "Supreme Commander", badge: "🏆" }
        ];

        function getRank(knockouts) {
            for (let i = MILITARY_RANKS.length - 1; i >= 0; i--) {
                if (knockouts >= MILITARY_RANKS[i].min) return MILITARY_RANKS[i];
            }
            return MILITARY_RANKS[0];
        }

        // ===================================================================
        // 2. SOCKET.IO EVENTS (The "Phone Line" to Server)
        // ===================================================================
        
        socket.on('connect', () => {
            console.log("✅ Connected to Server! ID:", socket.id);
            myId = socket.id;
            document.getElementById('connection-status').innerText = "🟢 Server Online";
            document.getElementById('connection-status').style.color = "green";
        });

        socket.on('disconnect', () => {
            console.log("❌ Disconnected");
            document.getElementById('connection-status').innerText = "🔴 Disconnected - Reconnecting...";
            document.getElementById('connection-status').style.color = "red";
        });

        // Update Room Populations on Start Screen
        socket.on('roomCounts', (counts) => {
            const display = Object.keys(counts).map(k => `${k.replace('arena-', '').toUpperCase()}: ${counts[k]}`).join(' | ');
            document.getElementById('room-counts').innerText = display;
        });

        // Initial Room Load
        socket.on('roomState', (data) => {
            // Load everyone currently in the room
            otherPlayers = data.players || {};
            delete otherPlayers[myId]; // Remove myself from this list
        });

        // New Player Joined
        socket.on('playerJoined', (data) => {
            if (data.playerId !== myId) {
                otherPlayers[data.playerId] = data.playerData;
            }
        });

        // Player Moved
        socket.on('playerUpdate', (data) => {
            if (otherPlayers[data.playerId]) {
                // Simple interpolation could go here, but direct update for now
                otherPlayers[data.playerId].x = data.playerData.x;
                otherPlayers[data.playerId].y = data.playerData.y;
                otherPlayers[data.playerId].knockouts = data.playerData.knockouts;
            }
        });

        // Player Left
        socket.on('playerLeft', (data) => {
            delete otherPlayers[data.playerId];
        });

        // Battle Request Received
        // Battle Started (from server)
        socket.on('battleStarted', (data) => {
            console.log('📥 Received battleStarted event:', data);
            console.log('My ID:', myId);
            console.log('Initiator:', data.battleData.initiator);
            console.log('Target:', data.battleData.target);
            
            // Check if I'm involved in this battle
            if (data.battleData.initiator === myId || data.battleData.target === myId) {
                console.log('✅ I am involved in this battle! Showing quiz...');
                
                // Pass the question and battleId to showQuiz
                showQuiz({
                    battleId: data.battleId,
                    question: data.battleData.question,
                    opponent: data.battleData.initiator === myId ? data.battleData.target : data.battleData.initiator
                });
            } else {
                console.log('❌ Not my battle, ignoring');
            }
        });

        // Battle Result
        socket.on('battleResult', (data) => {
            console.log('Battle result:', data);
            closeQuiz();
            
            if (data.winner === myId) {
                myPlayer.knockouts++;
                alert("🎉 VICTORY! You won the battle!");
            } else if (data.loser === myId) {
                respawn();
                alert("💀 DEFEATED! You have been sent to the graveyard!");
            }
        });

        // ===================================================================
        // 3. GAME ENGINE
        // ===================================================================

        function startGame() {
            const nameInput = document.getElementById('playerName').value.trim();
            const roomSelect = document.getElementById('roomSelect').value;

            if (!nameInput) {
                alert("Please enter a name!");
                return;
            }

            // Setup My Player
            myPlayer.name = nameInput;
            myPlayer.room = roomSelect;
            
            // Random Start Position (not in graveyard)
            do {
                myPlayer.x = 200 + Math.random() * (WORLD_WIDTH - 400);
                myPlayer.y = 200 + Math.random() * (WORLD_HEIGHT - 400);
            } while (isInGraveyard(myPlayer.x, myPlayer.y));

            // Join the Server Room
            socket.emit('joinRoom', {
                room: roomSelect,
                playerData: myPlayer
            });

            // Update UI
            document.getElementById('startMenu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('room-display').innerText = "📍 " + roomSelect.toUpperCase();
            
            gameStarted = true;
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        }

        // ===================================================================
        // GRAVEYARD & MINIMAP FUNCTIONS
        // ===================================================================
        
        function isInGraveyard(x, y) {
            return x > GRAVEYARD.x - GRAVEYARD.width/2 &&
                   x < GRAVEYARD.x + GRAVEYARD.width/2 &&
                   y > GRAVEYARD.y - GRAVEYARD.height/2 &&
                   y < GRAVEYARD.y + GRAVEYARD.height/2;
        }

        function drawGraveyard() {
            const gx = GRAVEYARD.x - camera.x;
            const gy = GRAVEYARD.y - camera.y;
            
            // Dark ground
            ctx.fillStyle = 'rgba(40, 40, 50, 0.8)';
            ctx.fillRect(gx - GRAVEYARD.width/2, gy - GRAVEYARD.height/2, GRAVEYARD.width, GRAVEYARD.height);
            
            // Border
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            ctx.strokeRect(gx - GRAVEYARD.width/2, gy - GRAVEYARD.height/2, GRAVEYARD.width, GRAVEYARD.height);
            
            // Sign
            ctx.font = 'bold 24px Arial';
            ctx.fillStyle = '#888';
            ctx.textAlign = 'center';
            ctx.fillText('☠️ GRAVEYARD ☠️', gx, gy - GRAVEYARD.height/2 + 30);
            ctx.fillText('🛡️ SAFE ZONE 🛡️', gx, gy - GRAVEYARD.height/2 + 60);
            
            // Gravestones
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const radius = GRAVEYARD.width / 3;
                const sx = gx + Math.cos(angle) * radius;
                const sy = gy + Math.sin(angle) * radius;
                ctx.font = '30px Arial';
                ctx.fillText('🪦', sx, sy);
            }
        }

        function updateMinimap() {
            const minimapCanvas = document.getElementById('minimap');
            const minimapCtx = minimapCanvas.getContext('2d');
            const scale = 150 / WORLD_WIDTH;
            
            minimapCtx.clearRect(0, 0, 150, 150);
            minimapCtx.fillStyle = 'rgba(26, 26, 46, 0.8)';
            minimapCtx.fillRect(0, 0, 150, 150);
            
            // Draw graveyard
            minimapCtx.fillStyle = 'rgba(80, 80, 100, 0.8)';
            minimapCtx.fillRect(
                (GRAVEYARD.x - GRAVEYARD.width/2) * scale,
                (GRAVEYARD.y - GRAVEYARD.height/2) * scale,
                GRAVEYARD.width * scale,
                GRAVEYARD.height * scale
            );
            
            // Draw my player
            minimapCtx.fillStyle = '#e94560';
            minimapCtx.beginPath();
            minimapCtx.arc(myPlayer.x * scale, myPlayer.y * scale, 4, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Draw others
            Object.values(otherPlayers).forEach(p => {
                minimapCtx.fillStyle = isInGraveyard(p.x, p.y) ? '#888' : '#4ECDC4';
                minimapCtx.beginPath();
                minimapCtx.arc(p.x * scale, p.y * scale, 3, 0, Math.PI * 2);
                minimapCtx.fill();
            });
            
            // Border
            minimapCtx.strokeStyle = '#e94560';
            minimapCtx.lineWidth = 2;
            minimapCtx.strokeRect(0, 0, 150, 150);
        }

        function updateLeaderboard() {
            const allPlayers = [myPlayer, ...Object.values(otherPlayers)];
            const sorted = allPlayers.sort((a, b) => b.knockouts - a.knockouts).slice(0, 10);
            
            const html = sorted.map((p, i) => {
                const rank = getRank(p.knockouts);
                const isMe = p.id === myId || p === myPlayer;
                const className = isMe ? 'leaderboard-entry current-player' : 'leaderboard-entry';
                return `<div class="${className}">
                    <span>${rank.badge} ${p.name}</span>
                    <span>${p.knockouts} KO</span>
                </div>`;
            }).join('');
            
            document.getElementById('leaderboardList').innerHTML = html;
        }

        function updateCamera() {
            camera.x = myPlayer.x - canvas.width / 2;
            camera.y = myPlayer.y - canvas.height / 2;
        }

        function gameLoop() {
            if (!gameStarted) return;

            // 1. Handle respawn
            if (isRespawning) {
                const timeLeft = Math.ceil((RESPAWN_TIME - (Date.now() - respawnTimer)) / 1000);
                document.getElementById('respawnCountdown').textContent = Math.max(0, timeLeft);
                
                if (Date.now() - respawnTimer >= RESPAWN_TIME) {
                    isRespawning = false;
                    document.getElementById('respawnOverlay').style.display = 'none';
                    // Respawn outside graveyard
                    do {
                        myPlayer.x = 200 + Math.random() * (WORLD_WIDTH - 400);
                        myPlayer.y = 200 + Math.random() * (WORLD_HEIGHT - 400);
                    } while (isInGraveyard(myPlayer.x, myPlayer.y));
                }
            }

            // 2. Move
            if (!isRespawning) {
                handleMovement();
            } else {
                // Can move in graveyard while waiting
                let dx = 0, dy = 0;
                if (keys['ArrowUp'] || keys['KeyW']) dy = -SPEED;
                if (keys['ArrowDown'] || keys['KeyS']) dy = SPEED;
                if (keys['ArrowLeft'] || keys['KeyA']) dx = -SPEED;
                if (keys['ArrowRight'] || keys['KeyD']) dx = SPEED;
                
                myPlayer.x += dx;
                myPlayer.y += dy;
                
                // Keep in graveyard
                myPlayer.x = Math.max(GRAVEYARD.x - GRAVEYARD.width/2 + 30, 
                                     Math.min(GRAVEYARD.x + GRAVEYARD.width/2 - 30, myPlayer.x));
                myPlayer.y = Math.max(GRAVEYARD.y - GRAVEYARD.height/2 + 30,
                                     Math.min(GRAVEYARD.y + GRAVEYARD.height/2 - 30, myPlayer.y));
            }

            // 3. Update camera
            updateCamera();

            // 4. Draw Background
            ctx.fillStyle = settings.contrast ? '#000' : '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawGraveyard();

            // 5. Draw Others
            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                const screenX = p.x - camera.x;
                const screenY = p.y - camera.y;
                const rank = getRank(p.knockouts);
                drawEmojiPlayer(screenX, screenY, p.emoji, `${rank.badge} ${p.name}`, false);
            });

            // 6. Draw Me
            const screenX = myPlayer.x - camera.x;
            const screenY = myPlayer.y - camera.y;
            const myRank = getRank(myPlayer.knockouts);
            const displayName = isRespawning ? '👻 Ghost' : `${myRank.badge} ${myPlayer.name}`;
            drawEmojiPlayer(screenX, screenY, myPlayer.emoji, displayName, true);

            // 7. Update UI
            document.getElementById('score-display').innerText = `🏆 Knockouts: ${myPlayer.knockouts} | ${myRank.name}`;
            updateMinimap();
            updateLeaderboard();

            // 8. Send Update to Server
            socket.emit('updatePlayer', {
                x: myPlayer.x,
                y: myPlayer.y,
                knockouts: myPlayer.knockouts,
                inGraveyard: isRespawning
            });

            requestAnimationFrame(gameLoop);
        }

        function handleMovement() {
            let dx = 0; 
            let dy = 0;

            if (keys['ArrowUp'] || keys['KeyW']) dy = -SPEED;
            if (keys['ArrowDown'] || keys['KeyS']) dy = SPEED;
            if (keys['ArrowLeft'] || keys['KeyA']) dx = -SPEED;
            if (keys['ArrowRight'] || keys['KeyD']) dx = SPEED;

            // Move and keep in world bounds
            myPlayer.x += dx;
            myPlayer.y += dy;
            
            myPlayer.x = Math.max(50, Math.min(WORLD_WIDTH - 50, myPlayer.x));
            myPlayer.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, myPlayer.y));

            // Collision Check (Trigger Battle)
            if (dx !== 0 || dy !== 0) {
                checkCollisions();
            }
        }

        // Throttle battles so they don't spam
        let lastBattleTime = 0;
        function checkCollisions() {
            if (isRespawning) return; // Can't battle while respawning
            
            const now = Date.now();
            if (now - lastBattleTime < 3000) return; // 3 second cooldown
            
            // No battles in graveyard!
            if (isInGraveyard(myPlayer.x, myPlayer.y)) return;

            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                
                // Don't attack players in graveyard
                if (p.inGraveyard || isInGraveyard(p.x, p.y)) return;
                
                const dist = Math.hypot(myPlayer.x - p.x, myPlayer.y - p.y);
                
                // Only log when getting close
                if (dist < 200) {
                    console.log(`Getting close to ${p.name}: ${Math.round(dist)}px (need ${COLLISION_DISTANCE}px)`);
                }
                
                if (dist < COLLISION_DISTANCE) {
                    // COLLISION! Start Battle
                    lastBattleTime = now;
                    console.log("🔥 COLLISION DETECTED with", p.name);
                    
                    // Pick a random question
                    const qIndex = Math.floor(Math.random() * INDUS_QUESTIONS.length);
                    const question = INDUS_QUESTIONS[qIndex];

                    console.log("📤 Sending startBattle event:", {
                        initiator: myId,
                        target: id,
                        question: question
                    });

                    socket.emit('startBattle', {
                        initiator: myId,
                        target: id,
                        question: question
                    });
                }
            });
        }

        function drawEmojiPlayer(x, y, emoji, name, isMe) {
            ctx.font = `${PLAYER_SIZE}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Draw Name
            ctx.fillStyle = isMe ? '#e94560' : '#fff';
            ctx.font = '14px Arial';
            ctx.fillText(name, x, y - 30);

            // Draw Emoji
            ctx.font = `${PLAYER_SIZE}px Arial`;
            ctx.fillText(emoji, x, y);

            // Draw Ring if me
            if (isMe) {
                ctx.beginPath();
                ctx.arc(x, y, 25, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(233, 69, 96, 0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            const size = 100;
            
            const startX = Math.floor(camera.x / size) * size;
            const startY = Math.floor(camera.y / size) * size;
            
            for (let x = startX; x < camera.x + canvas.width; x += size) {
                ctx.beginPath();
                ctx.moveTo(x - camera.x, 0);
                ctx.lineTo(x - camera.x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = startY; y < camera.y + canvas.height; y += size) {
                ctx.beginPath();
                ctx.moveTo(0, y - camera.y);
                ctx.lineTo(canvas.width, y - camera.y);
                ctx.stroke();
            }
        }

        function respawn() {
            // Send to graveyard
            myPlayer.x = GRAVEYARD.x;
            myPlayer.y = GRAVEYARD.y;
            myPlayer.knockouts = 0; // Reset knockouts on death
            
            // Start respawn timer
            isRespawning = true;
            respawnTimer = Date.now();
            document.getElementById('respawnOverlay').style.display = 'block';
            document.getElementById('respawnCountdown').textContent = '15';
        }

        // ===================================================================
        // 4. QUIZ LOGIC
        // ===================================================================

        function showQuiz(data) {
            console.log('🎯 showQuiz called with data:', data);
            
            const modal = document.getElementById('quizModal');
            const qText = document.getElementById('quizQuestion');
            const opts = document.getElementById('quizOptions');
            const timer = document.getElementById('timerBar');
            
            console.log('Modal element:', modal);
            console.log('Question:', data.question);
            
            modal.style.display = 'block';
            qText.innerText = data.question.q;
            opts.innerHTML = '';
            
            console.log('✅ Modal displayed, question text set');
            
            // Randomize answers so they aren't always in same spot
            let answers = data.question.a.map((ans, i) => ({ txt: ans, idx: i }));
            answers.sort(() => Math.random() - 0.5);

            answers.forEach(ans => {
                const btn = document.createElement('div');
                btn.className = 'quiz-btn';
                btn.innerText = ans.txt;
                btn.onclick = () => submitAnswer(data.battleId, ans.idx);
                opts.appendChild(btn);
            });

            console.log(`✅ ${answers.length} answer buttons created`);

            // Animate Timer
            timer.style.width = '100%';
            setTimeout(() => { timer.style.width = '0%'; }, 50);
        }

        function submitAnswer(battleId, answerIndex) {
            // Send answer to server
            socket.emit('answerBattle', {
                battleId: battleId,
                answerIndex: answerIndex
            });
            
            // Disable all buttons while waiting
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons.forEach(btn => {
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';
            });
            
            // Show waiting message
            document.getElementById('quizQuestion').innerText = 'Waiting for opponent...';
        }

        function closeQuiz() {
            document.getElementById('quizModal').style.display = 'none';
        }

        // ===================================================================
        // 5. UTILITIES (Input, Resize, Accessibility)
        // ===================================================================

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        // Resize Handling
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // Emoji Selector Logic
        const emojis = ["🛡️", "⚔️", "🏺", "🐮", "👑", "🧱", "🌽", "🐅"];
        const selector = document.getElementById('emojiSelector');
        emojis.forEach(e => {
            const el = document.createElement('div');
            el.className = 'emoji-option';
            el.innerText = e;
            el.onclick = () => {
                document.querySelectorAll('.emoji-option').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected');
                myPlayer.emoji = e;
            };
            if(e === myPlayer.emoji) el.classList.add('selected');
            selector.appendChild(el);
        });

        // Accessibility Functions
        function toggleDyslexia() {
            document.body.classList.toggle('dyslexia-font');
            settings.dyslexia = !settings.dyslexia;
        }
        function toggleContrast() {
            document.body.classList.toggle('high-contrast');
            settings.contrast = !settings.contrast;
        }
        function toggleMotion() {
            settings.motion = !settings.motion;
            alert(settings.motion ? "Motion enabled" : "Motion reduced");
        }

        document.getElementById('startButton').addEventListener('click', startGame);
    </script>
</body>
